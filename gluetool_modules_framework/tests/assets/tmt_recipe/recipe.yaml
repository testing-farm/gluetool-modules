---
plans:
  - cleanup:
      enabled: false
      phases:
        - how: tmt
          name: default-0
          order: 50
    discover:
      enabled: true
      phases:
        - dist-git-download-only: false
          dist-git-init: false
          dist-git-install-builddeps: false
          dist-git-merge: false
          dist-git-remove-fmf-root: /var/ARTIFACTS/work-tests/git-repo
          dist-git-source: false
          fmf-id: false
          how: fmf
          modified-only: false
          name: default-0
          order: 50
          prune: false
          sync-repo: false
          url-content-type: git
      tests:
        - discover-phase: default-0
          duration: 5m
          enabled: true
          framework: shell
          manual: false
          name: /tests/a
          order: 50
          path: /default-0/tests/tests/a
          restart-max-count: 1
          restart-with-reboot: false
          result: respect
          serial-number: 1
          summary: test a
          test: echo A $FOO
          tty: false
        - discover-phase: default-0
          duration: 5m
          enabled: true
          framework: shell
          manual: false
          name: /tests/b
          order: 50
          path: /default-0/tests/tests/b
          restart-max-count: 1
          restart-with-reboot: false
          result: respect
          serial-number: 2
          summary: test b
          test: echo B
          tty: false
    enabled: true
    execute:
      enabled: false
      phases:
        - duration: 1h
          exit-first: false
          how: tmt
          ignore-duration: false
          interactive: false
          name: default-0
          no-progress-bar: false
          order: 50
          restraint-compatible: false
      results-path: plans/smoke/execute/results.yaml
    finish:
      enabled: false
      phases:
        - how: shell
          name: default-0
          order: 50
    name: /plans/smoke
    order: 50
    prepare:
      enabled: false
      phases:
        - check-first: true
          exclude:
            - bar
          how: install
          missing: fail
          name: default-0
          order: 50
          package:
            - foo
    provision:
      enabled: false
      phases:
        - arch: x86_64
          become: false
          connection: session
          hardware:
            memory: '>= 4 GB'
          how: virtual
          image: fedora
          image-cache-age: 7 d
          list-local-images: false
          name: default-0
          order: 50
          stop-retries: 10
          stop-retry-delay: 1
          use-image-cache: true
          user: root
    report:
      enabled: false
      phases:
        - display-guest: auto
          how: display
          name: default-0
          order: 50
    summary: smoke
run:
  context: {}
  environment:
    FOO: bar
  remove: false
  root: /var/ARTIFACTS/work-tests/git-repo
